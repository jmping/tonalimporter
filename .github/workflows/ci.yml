name: CI

on:
  push:
    branches: [main, expand-ha-data]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Compile Python
        run: python -m compileall -q sync_workouts.py tonal_service.py custom_components/tonal_companion tests
      - name: Lint HA integration and companion service
        run: ruff check tonal_service.py custom_components/tonal_companion tests --ignore EXE001,UP006,UP035,UP045,RUF100,UP031
      - name: Test summary aggregation
        run: pytest -q tests
      - name: Validate JSON metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('custom_components/tonal_companion/manifest.json'),
              Path('custom_components/tonal_companion/strings.json'),
              Path('hacs.json'),
          ]:
              json.loads(path.read_text())
              print(f'valid: {path}')
          PY
      - name: Validate Compose file
        run: docker compose -f docker-compose.example.yml config
